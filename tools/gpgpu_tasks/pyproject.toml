[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpgpu-tasks"
version = "0.1.0"
description = "pydoit task definitions for the GPGPU project"
requires-python = ">=3.11"
dependencies = [
  "doit>=0.37,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
