[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpgpu-cli"
version = "0.1.0"
description = "GPGPU project control-plane CLI"
requires-python = ">=3.11"
dependencies = [
  "gpgpu-tasks",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.15,<1",
]

[tool.uv.sources]
gpgpu-tasks = { path = "../gpgpu_tasks", editable = true }

[project.scripts]
gpgpu = "cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["cli", "config"]

[tool.pytest.ini_options]
testpaths = ["tests/cli"]
addopts = "-q"
