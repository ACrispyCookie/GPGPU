architecture:
  num_cores: 24

hardware:
  fpga:
    part: xc7z020clg484-1
    agent:
      device: "210299730789"
      directory: /app
    uart:
      port: /dev/ttyUSB0
      baud: 115200
      sudo: true
      python: python3
    upload:
      destination: njason@192.168.1.13
      directory: /home/njason/upload
  serial:
    port: /dev/ttyACM0
    baud: 115200
  vivado:
    ip_project_name: gpgpu_ip_dev
    project_name: gpgpu_system
    bd_name: design_1
    top: design_1_wrapper
    xsa_name: gpgpu_platform
    version: "2025.2"
    jobs: 6
    peripheral:
      base_address: "0x43C00000"
      range: "0x00010000"
  vitis:
    version: "2025.2"
    platform_name: gpgpu_platform
    host_name: gpgpu_host
    cpu: ps7_cortexa9_0
    domain: standalone_ps7_cortexa9_0
    os: standalone
    template: empty_application
    default_archive: tools/hardware/vitis/default-project.zip
    host_sources:
      - software/host/xc7z020/gpgpu_driver.c
      - software/host/xc7z020/main.c

software:
  riscv:
    march: rv32im
    abi: ilp32

tests:
  rtl:
    sources:
      gpgpu: hardware/rtl/gpgpu

      exclude:
        - experimental
        - interfaces

      # Dependency order for the compile-first files (packages + interfaces),
      # paths relative to `root`. Verilator compiles in command-line order and
      # needs a package/interface declared before any file that uses its types,
      # INCLUDING other packages. List them base-first. Files matching the
      # package/interface convention but not listed here still come first (after
      # these), then all modules. Adjust to YOUR actual dependency graph — the
      # error messages name the deps (e.g. gpu_pkg defines word_t used widely).
      ordered:
        - packages/gpu_pkg.sv
        - packages/riscv_pkg.sv
        - packages/alu_pkg.sv
        - control/ControlPkg.sv
        - packages/warp_pkg.sv
        - packages/pipeline_pkg.sv
        - memory/MemoryInterface.sv
        - memory/MemorySubsystemPkg.sv
        - memory/MemorySubsystemInterface.sv
    # Applied to a suite when its `trace` is true: extra Verilator flags, and
    # the dump file passed to the bench as +DUMP_FILE (written in the suite's
    # build directory). FST keeps enum names; --trace-structs splits packed
    # structs into named fields.
    trace:
      verilator_flags:
        - --trace-fst
        - --trace-structs
      dump_file: dumpfile.fst
    # Per suite: `testbench` is relative to the repository root, `top` is the
    # bench's top module, `plusargs` are passed to the simulator as +NAME=value.
    # Directed SMX/E2E test IDs, inclusive: "all" or e.g. "1-10".
    range: "all"
    smx:
      testbench: tests/hardware/rtl/tb_GPGPU.sv
      top: tb_GPGPU_smx_only
      trace: false
      plusargs: {}
    e2e:
      testbench: tests/hardware/rtl/tb_GPGPU_e2e.sv
      top: tb_GPGPU_e2e
      trace: false
      # AXI4-Lite top sources (relative to sources.gpgpu), added on top of the
      # shared sources because `interfaces` is excluded for the SMX build.
      sources:
        - interfaces/AXI4LiteSlave.sv
        - interfaces/AXI4LiteTop.v
      # All required by the bench (no defaults in SystemVerilog). +TEST_END
      # is optional and may be added here to stop after a given case.
      plusargs:
        TEST_ROOT: cases            # relative to the suite's run directory
        CASE_PREFIX: test           # case directories are <prefix><index>
        TEST_IDX: 1                 # first case index
        PROGRAM_FILE: program.mem
        DATA_FILE: data.mem
        CLOCK_PERIOD_NS: 10
        RESET_CYCLES: 20
        TEST_TIMEOUT_CYCLES: 10000  # launch to completion IRQ
        AXI_TIMEOUT_CYCLES: 1000    # per AXI channel handshake
        RET_INSTR: "00008067"       # hex; kernel end, IMEM is loaded up to it
        UNMAPPED_ADDR: "00008000"   # hex; must decode to no CSR/IMEM/DMEM
        INFO_VERSION: 1             # INFO[31:16] reported by the CSR bank
    random:
      iterations: 100
      # Set a non-zero integer for reproducibility; 0 chooses and prints a seed.
      seed: 0

paths:
  rtl:
    sources:
      gpgpu: hardware/rtl/gpgpu
  build:
    root: build

# Commands are names or paths. Machine-specific paths belong in config/local.yaml.
tools:
  git:
    command: git
    required: true
  python:
    command: python3
    required: true
  make:
    command: make
    required: true
  native_cc:
    command: gcc
    required: true
  riscv_gcc:
    command: riscv64-unknown-elf-gcc
    required: true
  verilator:
    command: verilator
    required: true
  native_cxx:
    command: g++
    required: true
  vivado:
    command: vivado
    required: false
  vitis:
    command: vitis
    required: false
  ssh:
    command: ssh
    required: false
  scp:
    command: scp
    required: false
  gtkwave:
    command: gtkwave
    required: false
